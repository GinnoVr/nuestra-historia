<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia 🌌</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="stars"></div>
    <div id="stars2"></div>

    <div class="container">
        <div class="main-card">
            <img src="assets/mapa-estelar.png" alt="Mapa Estelar 19 de Junio" class="star-map">
        </div>

        <div class="counter-card">
            <h2>Tiempo transcurrido desde nuestro inicio:</h2>
            <div id="countdown">
                <div class="time-block">
                    <span id="days">00</span>
                    <p>Días</p>
                </div>
                <div class="time-block">
                    <span id="hours">00</span>
                    <p>Horas</p>
                </div>
                <div class="time-block">
                    <span id="minutes">00</span>
                    <p>Minutos</p>
                </div>
                <div class="time-block">
                    <span id="seconds">00</span>
                    <p>Segundos</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
