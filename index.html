<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Historia 🌌</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="stars"></div>
    <div id="stars2"></div>

    <button id="game-btn" class="game-button">Pregunta Seria</button>
    <button id="music-btn" class="music-button">Reproducir Musica</button>
    
    <audio id="background-music" src="assets/Ámame.mp3" loop></audio>

    <div class="container">
        <div class="main-card" id="star-map-card">
            <img src="assets/mapa-estelar.png.png" alt="Mapa Estelar 19 de Junio" class="star-map">
        </div>

        <div class="counter-card hidden" id="special-card" style="margin-bottom: 25px; background: rgba(255, 105, 180, 0.15); border-color: rgba(255, 105, 180, 0.3);">
            <h2 id="special-title" style="font-size: 16pt; font-weight: bold; color: #fff;"></h2>
            <p id="special-message" style="font-size: 11pt; color: #f1f5f9; margin-top: 10px; line-height: 1.4;"></p>
        </div>

        <div class="counter-card" id="time-box">
            <h2>Tiempo transcurrido desde nuestro inicio:</h2>
            <div id="countdown">
                <div class="time-block">
                    <span id="days">00</span>
                    <p>Dias</p>
                </div>
                <div class="time-block">
                    <span id="hours">00</span>
                    <p>Horas</p>
                </div>
                <div class="time-block">
                    <span id="minutes">00</span>
                    <p>Minutos</p>
                </div>
                <div class="time-block">
                    <span id="seconds">00</span>
                    <p>Segundos</p>
                </div>
            </div>
        </div>
    </div>

    <div id="game-overlay" class="hidden">
        <div id="game-hearts-bg"></div>
        
        <div class="game-content" id="game-card">
            <h2 id="game-question"></h2>
            
            <div class="game-buttons" id="game-buttons-container">
                <button id="btn-yes" class="game-ans-btn yes-btn"></button>
                <button id="btn-no" class="game-ans-btn no-btn"></button>
            </div>
        </div>
    </div>

    <div id="snoopy-overlay" class="hidden">
        <div class="snoopy-content">
            <img src="assets/snoopy-kiss.gif" alt="Snoopy Sorpresa" class="snoopy-img">
            <h3>Encontraste el secreto!</h3>
            <button id="close-snoopy">Cerrar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
